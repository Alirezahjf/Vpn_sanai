# =============================================================================
#  vpn-sanai :: config/defaults.conf
#  Default values used by install.sh and the helper scripts.
#
#  The file is sourced as shell code. Override anything by exporting the
#  variable before running (env wins), editing this file, or passing the
#  matching command line flag (flags win over both).
# =============================================================================

# --- panel -------------------------------------------------------------------
# Empty PANEL_PORT => a random free port from PANEL_PORT_RANGE_MIN..MAX
PANEL_PORT_DEFAULT=""
PANEL_PORT_RANGE_MIN=20000
PANEL_PORT_RANGE_MAX=45000
# Base path is generated when empty. Passed to the official installer without
# slashes; the panel stores it as /<value>/.
PANEL_BASE_PATH_DEFAULT=""
PANEL_USER_DEFAULT=""
PANEL_PASS_DEFAULT=""
PANEL_TLS_SELF_SIGNED_DEFAULT="yes"   # tunnel mode: wrap loopback panel in TLS

# Panel access mode:
#   tunnel : bind the panel to 127.0.0.1, reach it through an SSH tunnel (safest)
#   public : bind to all interfaces so the panel is reachable at https://IP:PORT
PANEL_ACCESS_MODE_DEFAULT="tunnel"

# --- 3x-ui / xray ------------------------------------------------------------
# Pinned panel version. "latest" follows the newest release, "dev" the rolling
# development build. Bump deliberately: x-ui update is never run silently.
XUI_VERSION_DEFAULT="latest"
XUI_MAIN_FOLDER="/usr/local/x-ui"

# --- VLESS + Reality inbound -------------------------------------------------
VLESS_PORT_DEFAULT="443"          # some VPS providers block 443; fallback below
VLESS_PORT_FALLBACK_MIN=20000
VLESS_PORT_FALLBACK_MAX=45000
REALITY_FINGERPRINT="chrome"      # chrome | firefox | safari | ios | android | edge | random
REALITY_SPIDER_X="/"
REALITY_TARGET_PORT=443
REALITY_MAX_TIME_DIFF=0           # 0 = server default (xray: no skew allowance)
# Candidate SNI/target hosts, in preference order. They are probed at install
# time (TLS 1.3 + HTTP/2 + valid certificate from the server's point of view)
# and the fastest one that passes is used. Keep hosts that are (a) reachable
# from your server and (b) plain CDNs/big sites — never a domain you own.
REALITY_SNI_CANDIDATES=(
    "www.microsoft.com"
    "www.apple.com"
    "dl.google.com"
    "www.amazon.com"
    "www.bing.com"
    "www.cloudflare.com"
    "www.samsung.com"
    "www.lovelive-anime.jp"
)
REALITY_SNI_IPV6=false            # allow IPv6-only targets (usually leave off)
# Extra inbound with xHTTP transport (harder to fingerprint, worse throughput)
# created alongside the TCP+Vision one. yes|no
CREATE_XHTTP_INBOUND_DEFAULT="no"
XHTTP_PORT_DEFAULT="8443"         # a second inbound can never share the TCP port
XHTTP_PATH_DEFAULT=""             # empty => random /<12 chars>
XHTTP_MODE="auto"                 # auto | packet-up | stream-up | stream-one

# --- clients -----------------------------------------------------------------
DEFAULT_CLIENT_EMAIL="user1"
DEFAULT_CLIENT_TOTAL_GB=0         # 0 = unlimited
DEFAULT_CLIENT_EXPIRY_DAYS=0      # 0 = unlimited
DEFAULT_CLIENT_LIMIT_IP=0         # 0 = unlimited (needs the IP Limit feature)

# --- subscription ------------------------------------------------------------
SUB_PORT_DEFAULT=2096
SUB_PATH_DEFAULT="/sub/"
ENABLE_SUBSCRIPTION_DEFAULT="yes"

# --- security ----------------------------------------------------------------
ENABLE_UFW_DEFAULT="yes"
ENABLE_FAIL2BAN_DEFAULT="yes"
ENABLE_BBR_DEFAULT="yes"
ENABLE_SYSCTL_TUNING_DEFAULT="yes"
ENABLE_TIMESYNC_DEFAULT="yes"
ENABLE_UNATTENDED_UPGRADES_DEFAULT="no"   # Debian/Ubuntu only
# Ports always left open by UFW, besides SSH / panel / VLESS
UFW_EXTRA_TCP_PORTS=()
# Where the SSH port change is recorded / how long the old port stays open
SSH_PORT_DEFAULT=""               # empty => keep the current port, only harden
SSH_PORT_GRACE_MINUTES=10         # auto-revert window after a port change

# --- backup ------------------------------------------------------------------
BACKUP_ENABLED_DEFAULT="yes"
BACKUP_CRON_DEFAULT="30 3 * * *"
BACKUP_KEEP_DAYS=14
INCLUDE_LINKS_IN_BACKUP=true

# --- Telegram bot ------------------------------------------------------------
# The management bot is configured at runtime into /etc/vpn-sanai/telegram.env
# (created by `vpn-sanai-telegram --setup`); these are the fallback defaults.
TG_BOT_TOKEN_DEFAULT=""            # empty -> the bot is not configured
TG_ADMIN_IDS_DEFAULT=""            # space/comma separated Telegram user ids
TG_POLL_TIMEOUT_DEFAULT=50         # long-poll seconds (0 = return immediately)
TG_AUTO_DELETE_DEFAULT=90          # seconds a secrets message stays alive (0 = never)
TG_DAILY_REPORT_DEFAULT="yes"      # send the admins a daily status digest
TG_DAILY_REPORT_HOUR_DEFAULT=8     # local hour (0-23) for the digest
VPN_SANAI_TG_UNIT_NAME="vpn-sanai-telegram"

# --- misc --------------------------------------------------------------------
TZ_DEFAULT="Asia/Tehran"
# Mirrors used when the direct GitHub URLs are unreachable (Iran-friendly).
XUI_INSTALL_URL_DEFAULT="https://raw.githubusercontent.com/MHSanaei/3x-ui/master/install.sh"
XUI_INSTALL_MIRROR_URLS=(
    "https://cdn.jsdelivr.net/gh/MHSanaei/3x-ui@master/install.sh"
    "https://ghproxy.net/https://raw.githubusercontent.com/MHSanaei/3x-ui/master/install.sh"
)
